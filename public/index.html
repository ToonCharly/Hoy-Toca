<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hoy toca: actividades y recordatorios</title>
  <meta name="description" content="Administra tus actividades y recordatorios personales. Funciona sin conexión y te avisa a tiempo.">
  <meta name="theme-color" content="#F3F5F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1B1C" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Ir al contenido</a>

  <header class="top">
    <h1>Hoy toca</h1>
    <div id="net" class="net" data-state="on"><span class="dot" aria-hidden="true"></span><span id="net-text">En línea</span></div>
    <button id="btn-settings" class="icon-btn" type="button" aria-label="Ajustes"></button>
  </header>

  <main id="main">
    <section id="hero" class="hero" aria-labelledby="hero-h"></section>
    <p id="pending" class="pending" role="status"></p>

    <div class="tools">
      <label class="sr" for="q">Buscar actividades</label>
      <input id="q" type="search" placeholder="Buscar actividades" autocomplete="off">
      <div class="filters" role="group" aria-label="Filtrar actividades">
        <button type="button" class="chip" data-filter="todas" aria-pressed="true">Todas</button>
        <button type="button" class="chip" data-filter="pendientes" aria-pressed="false">Pendientes</button>
        <button type="button" class="chip" data-filter="hechas" aria-pressed="false">Hechas</button>
      </div>
    </div>

    <div id="list"></div>
    <noscript><p>Necesitas activar JavaScript para usar esta aplicación.</p></noscript>
  </main>

  <button id="fab" class="fab" type="button">Nueva actividad</button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="dlg-form" aria-labelledby="form-title">
    <form id="form">
      <h2 id="form-title">Nueva actividad</h2>
      <label for="f-title">Título</label>
      <input id="f-title" required maxlength="120" autocomplete="off">
      <label for="f-notes">Notas</label>
      <textarea id="f-notes" rows="3" maxlength="500"></textarea>
      <label for="f-due">Fecha y hora</label>
      <input id="f-due" type="datetime-local">
      <label for="f-remind">Recordarme</label>
      <select id="f-remind"></select>
      <div class="row">
        <button type="button" id="f-cancel" class="btn ghost">Cancelar</button>
        <button type="submit" id="f-submit" class="btn primary">Guardar actividad</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-set" aria-labelledby="set-title">
    <div class="sheet">
      <h2 id="set-title">Ajustes</h2>
      <section>
        <h3>Avisos en este dispositivo</h3>
        <p id="notif-state"></p>
        <div class="row">
          <button type="button" id="btn-notif" class="btn">Activar avisos</button>
          <button type="button" id="btn-test" class="btn ghost" hidden>Probar aviso</button>
        </div>
      </section>
      <section>
        <h3>Avisos con la app cerrada</h3>
        <p id="push-state"></p>
        <div class="row">
          <button type="button" id="btn-push" class="btn">Activar push</button>
          <button type="button" id="btn-push-test" class="btn ghost" hidden>Enviar push de prueba</button>
        </div>
      </section>
      <section>
        <h3>Sincronización</h3>
        <p id="sync-state"></p>
        <button type="button" id="btn-sync" class="btn">Sincronizar ahora</button>
      </section>
      <section id="sec-install" hidden>
        <h3>Instalar</h3>
        <p>Agrega Hoy toca a tu pantalla de inicio.</p>
        <button type="button" id="btn-install" class="btn">Instalar app</button>
      </section>
      <div class="row"><button type="button" id="set-close" class="btn primary">Cerrar</button></div>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
